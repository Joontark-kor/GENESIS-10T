[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-10t"
version = "0.2.0"
description = "Research-oriented foundation model project: from data to a scalable Mixture-of-Experts Transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
parquet = ["pyarrow>=14"]
export = ["transformers>=4.45", "safetensors>=0.4"]
eval = ["transformers>=4.45", "safetensors>=0.4", "lm_eval>=0.4.5", "accelerate", "datasets"]

[tool.setuptools.packages.find]
where = ["."]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
